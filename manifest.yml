lzc-sdk-version: "0.1"
name: ResilioSync
package: cloud.lazycat.app.resilio-sync
version: 3.0.3
description: 使用 BitTorrent 协议在您的所有设备之间同步文件和文件夹
homepage: https://www.resilio.com
author: resilio
application:
    subdomain: resilio-sync
    multi_instance: true
    routes:
        - /=http://resilio-sync:8888/
    ingress:
        - protocol: tcp
          port: 5555
          service: resilio-sync
services:
    resilio-sync:
        image: docker.1ms.run/linuxserver/resilio-sync:3.0.3
        environment:
            - PUID=1000
            - PGID=1000
            - TZ=Asia/Shanghai
        binds:
            - /lzcapp/var/config:/config
            - /lzcapp/var/downloads:/downloads
            - /lzcapp/var/data:/sync
